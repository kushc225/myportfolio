<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glowing Yellow Laptop Gradient (from photo) -->
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49363"/>
      <stop offset="100%" stop-color="#b87442"/>
    </linearGradient>

    <!-- Hair Texture Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Plaid Shirt Pattern -->
    <pattern id="plaidShirt" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#0284c7"/>
      <rect x="0" y="0" width="10" height="4" fill="#38bdf8" fill-opacity="0.6"/>
      <rect x="0" y="0" width="4" height="10" fill="#f8fafc" fill-opacity="0.4"/>
    </pattern>

    <clipPath id="circleClip">
      <circle cx="64" cy="64" r="58"/>
    </clipPath>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="64" cy="64" r="62" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>

  <g clip-path="url(#circleClip)">
    <!-- Dark Studio Background -->
    <rect width="128" height="128" fill="url(#bgGrad)"/>

    <!-- Background Wall Emblems (from photo) -->
    <!-- Star Emblem on right -->
    <circle cx="106" cy="24" r="22" fill="#ea580c" fill-opacity="0.35"/>
    <path d="M 106 10 L 109 19 L 119 20 L 111 26 L 114 36 L 106 30 L 98 36 L 101 26 L 93 20 L 103 19 Z" fill="#ffffff" fill-opacity="0.25"/>

    <!-- Lightbulb Emblem on left -->
    <circle cx="20" cy="20" r="18" fill="#0284c7" fill-opacity="0.25"/>
    <circle cx="20" cy="18" r="7" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>

    <!-- Developer Body & Checkered Plaid Shirt -->
    <path d="M 22 128 C 22 96 40 88 52 86 L 64 96 L 76 86 C 88 88 106 96 106 128 Z" fill="url(#plaidShirt)"/>

    <!-- Shirt Collar & V-Neck -->
    <path d="M 50 86 L 64 100 L 78 86 L 68 84 L 64 92 L 60 84 Z" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M 58 86 L 64 95 L 70 86 Z" fill="url(#skinGrad)"/>

    <!-- Neck -->
    <path d="M 54 70 L 54 86 L 74 86 L 74 70 Z" fill="url(#skinGrad)"/>

    <!-- Head & Face -->
    <path d="M 44 48 C 44 32 84 32 84 48 C 84 66 76 78 64 78 C 52 78 44 66 44 48 Z" fill="url(#skinGrad)"/>

    <!-- Ears & In-Ear Monitors (from photo) -->
    <!-- Left ear -->
    <ellipse cx="43" cy="52" rx="3.5" ry="5.5" fill="#b87442"/>
    <!-- Right ear -->
    <ellipse cx="85" cy="52" rx="3.5" ry="5.5" fill="#b87442"/>
    <!-- Signature Yellow Earbud in right ear -->
    <circle cx="86" cy="53" r="2.2" fill="#facc15"/>
    <!-- Black Earphone Cord curving down -->
    <path d="M 86 54 C 88 62 82 72 74 82 L 72 90" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Modern Textured Fade Haircut (from photo) -->
    <!-- Side fade -->
    <path d="M 43 50 C 43 40 45 35 48 30 C 53 23 75 23 80 30 C 83 35 85 40 85 50 C 82 45 80 38 78 35 C 72 32 56 32 50 35 C 48 38 46 45 43 50 Z" fill="#1e293b"/>
    <!-- Pompadour / Comb-Over top sweep -->
    <path d="M 46 32 C 48 20 62 17 76 22 C 84 25 84 31 82 35 C 75 28 62 26 50 31 Z" fill="url(#hairGrad)"/>
    <!-- Hair volume texture lines -->
    <path d="M 52 26 C 60 22 70 24 76 27" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 54 30 C 62 26 72 28 78 31" fill="none" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Eyebrows (Focused downward) -->
    <path d="M 50 48 Q 56 46 60 49" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 68 49 Q 72 46 78 48" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Eyes (Looking down at laptop screen) -->
    <ellipse cx="55" cy="52" rx="3.2" ry="1.6" fill="#0f172a"/>
    <ellipse cx="73" cy="52" rx="3.2" ry="1.6" fill="#0f172a"/>
    <path d="M 52 51 Q 55 50 58 52" fill="none" stroke="#0f172a" stroke-width="1.2"/>
    <path d="M 70 52 Q 73 50 76 51" fill="none" stroke="#0f172a" stroke-width="1.2"/>

    <!-- Nose -->
    <path d="M 64 50 L 62 60 L 66 60" fill="none" stroke="#8c5028" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mustache (from photo) -->
    <path d="M 55 64 Q 64 63 73 64 Q 69 67 64 66 Q 59 67 55 64 Z" fill="#0f172a"/>

    <!-- Lips & Beard Stubble -->
    <path d="M 59 69 Q 64 70 69 69" fill="none" stroke="#8c5028" stroke-width="1.4"/>
    <path d="M 60 74 Q 64 75 68 74" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Screen Glow illuminating face upward -->
    <polygon points="34,128 94,128 76,68 52,68" fill="#fef08a" fill-opacity="0.12"/>

    <!-- Open Yellow Laptop (Foreground, from photo) -->
    <path d="M 28 128 L 38 100 L 90 100 L 100 128 Z" fill="url(#laptopGrad)"/>
    <path d="M 38 100 L 90 100" stroke="#fef08a" stroke-width="2"/>

    <!-- Laptop Apple/Code Badge -->
    <circle cx="64" cy="114" r="8" fill="#0f172a" fill-opacity="0.85"/>
    <text x="64" y="117" font-family="-apple-system, sans-serif" font-weight="900" font-size="7" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
